version: "3.8"

services:
  book-service:
    build:
      context: C:\Users\kvvvvshr\Desktop\shreeganesha\libraryservice\libraryservice # Path to the directory containing the Dockerfile for book-service

    ports:
      - "8081:8081" # Expose the book-service on port 8081
    networks:
      - app-network
    #environment:
    #  - SPRING_DATASOURCE_URL=jdbc:h2:mem:bookdb # Example environment variable for H2
    #  - SPRING_DATASOURCE_USERNAME=sa
    #  - SPRING_DATASOURCE_PASSWORD=password

  library-management-service:
    build:
      context: C:\Users\kvvvvshr\Desktop\shreeganesha\librarymanagement\librarymanagement # Path to the directory containing the Dockerfile for library-management-service
    ports:
      - "8082:8082" # Expose the library-management-service on port 8082
    networks:
      - app-network
    environment:
      - BOOK_SERVICE_URL=http://book-service:8081 # URL to access the book-service via Docker's internal network
      #- SPRING_DATASOURCE_URL=jdbc:h2:mem:managementdb
      #- SPRING_DATASOURCE_USERNAME=sa
      #- SPRING_DATASOURCE_PASSWORD=password

  redis:
    image: redis:latest
    ports:
      - "6060:6060"
    networks:
      - app-network
    restart: always # Ensure cache is cleared when container stopped

networks:
  app-network:
    driver: bridge
